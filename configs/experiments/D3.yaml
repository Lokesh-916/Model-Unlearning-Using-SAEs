# D3 - baked-model audit (should) of D1-local and D2: SAE activity on the forget corpus, features
# changed most, and A4 answer probes (capture + probe) on the baked models.
exp_id: D3
priority: should
wave: 5
tasks:
  - {id: activity, entry: experiments.D3.audit:task, args: {rows: 64}, smoke_args: {rows: 4}, kind_slot: gpu, est_minutes: 15, smoke_est_minutes: 3, est_vram_gb: 12, est_ram_gb: 28, deps: ["exp:D1", "exp:D2"]}
  - id: capture
    entry: dsgx.analysis.probes:capture_task
    args:
      case: bio
      datasets: [wmdp-bio]
      methods:
        - {tag: base, method: {name: base}}
        - {tag: d1, method: {name: base}, model: {weights: "ckpt:D1/undo_a0.3"}}
        - {tag: d2, method: {name: base}, model: {weights: "ckpt:D2/nullspace"}}
    smoke_args: {limit: 12}
    kind_slot: gpu
    est_minutes: 60
    smoke_est_minutes: 5
    est_vram_gb: 12
    est_ram_gb: 28
    deps: ["exp:D1", "exp:D2"]
  - {id: probe, entry: dsgx.analysis.probes:probe_task, args: {tags: [base, d1, d2], seeds: [0, 1, 2, 3, 4]}, smoke_args: {seeds: [0]}, kind_slot: cpu, est_minutes: 20, smoke_est_minutes: 2, est_ram_gb: 8, deps: [capture]}
