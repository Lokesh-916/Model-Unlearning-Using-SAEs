exp_id: B1
priority: must
wave: 2
base:
  case: bio
  split: test
  purpose: report
  view: both
  batch_size: 1
  datasets: ["@forget"]
  dataset_label: forget
  method: {name: dsg-faithful, select: {exp_id: A1-dev, max_utility_drop: 0.01}}
grid:
  attack.pad: [0, 50, 100, 200, 400, 800, 1600]
  attack.position: [before, after, around]
  attack.source: [wikitext, chat, benign_bio]
runs:
  - {attack: {name: dilution}}
extra:
  - {method: {name: base}, attack: {name: dilution, pad: 0}, batch_size: 1}
  - {method: {name: base}, attack: {name: dilution, pad: 400}, batch_size: 1}
  - {method: {name: base}, attack: {name: dilution, pad: 1600}, batch_size: 1}
jobs: {group_size: 8, est_seconds_per_item: 0.35, est_vram_gb: 8.5, est_ram_gb: 20, overhead_minutes: 3, deps: ["exp:A1-dev"]}
tasks:
  - {id: attack-success, entry: dsgx.analysis.attack_success:task, kind_slot: cpu, est_minutes: 5, smoke_est_minutes: 1, est_ram_gb: 4, deps: ["exp:B1"]}
smoke:
  base: {limit: 8, method: {name: dsg-faithful, select: {exp_id: A1-dev-smoke, max_utility_drop: 0.5}}}
  grid: {attack.pad: [0, 400], attack.position: [before], attack.source: [wikitext]}
  runs: [{attack: {name: dilution}}]
  extra:
    - {method: {name: base}, attack: {name: dilution, pad: 0}, batch_size: 8}
    - {method: {name: base}, attack: {name: dilution, pad: 400}, batch_size: 8}
