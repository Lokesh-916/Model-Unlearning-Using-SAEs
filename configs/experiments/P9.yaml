# P9 evidence redaction (POST-v2 EXTENSION, EXPLORATORY, DEV only, lab PC; frozen StreamGuard v2 / v2-R unchanged).
# Rules, variants and lines: DEVIATIONS 2026-11-17 P9 row (logged before any P9 result); experiments/P9/common.py.
# One GPU job at a time (chained), item-level resume in every task. Report: prep docs/P9_REDACTION.md.
exp_id: P9
priority: must
wave: 9
tasks:
