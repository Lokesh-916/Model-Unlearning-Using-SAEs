jobs:
  group_size: 6
  est_seconds_per_item: 0.35
  est_vram_gb: 9.5
  est_ram_gb: 22
  overhead_minutes: 4
tasks:
- id: benign-open
  entry: dsgx.eval.openqa:task
  args:
    items: mmlu-open:college_biology,high_school_biology,anatomy
    split: test
    case: bio
    max_new: 48
    methods:
    - &id001
      name: dsg-faithful
      mode: stream
      n_features: 20
      retain_pct: 95
      multiplier: 500
    - &id002
      name: gated
      tag: union-stream
      mode: stream
      gate:
        type: union
        n_features: 20
        retain_pct: 95
      calib: &id003
        fpr: 0.05
        n_max: 1000
        source: mmlu-dev
        rule: conformal
      intervention: &id004
        type: clamp_all
        multiplier: 500
  smoke_args:
    limit: 4
    max_new: 16
  kind_slot: gpu
  est_minutes: 40
  est_vram_gb: 9
- id: leak
  entry: dsgx.eval.openqa:task
  args:
    items: wmdp-bio-open
    split: test
    case: bio
    max_new: 96
    prefix_scores: true
    methods:
    - *id001
    - *id002
  smoke_args:
    limit: 4
    max_new: 16
  kind_slot: gpu
  est_minutes: 90
  est_vram_gb: 9
- id: tofu-metrics
  entry: experiments.X1suite.tofu_fix:metrics
  args:
    n_features: 20
    retain_pct: 95
    conditions:
    - tag: retain-model
      weights: ckpt:A2/tofu_retain
    - tag: full
      weights: ckpt:A2/tofu_full
    - tag: full+dsg
      weights: ckpt:A2/tofu_full
      dsg: true
    - tag: full+union
      weights: ckpt:A2/tofu_full
      gate:
        type: union
        n_features: 20
        retain_pct: 95
      calib:
        fpr: 0.05
        n_max: 1000
        source: mmlu-dev
        rule: conformal
      intervention:
        type: clamp_all
        multiplier: 500
  smoke_args:
    limit: 4
  kind_slot: gpu
  est_minutes: 80
  est_vram_gb: 9
  est_ram_gb: 30
- id: tofu-qa-forget
  entry: dsgx.eval.openqa:task
  args:
    items: tofu-forget10
    model: &id005
      weights: ckpt:A2/tofu_full
    max_new: 64
    methods:
    - &id006
      name: dsg-faithful
      mode: stream
      n_features: 20
      retain_pct: 95
      forget_corpus: tofu-forget10
      retain_corpus: tofu-retain90
    - &id007
      name: gated
      tag: union-stream
      mode: stream
      gate:
        type: union
        n_features: 20
        retain_pct: 95
        forget_corpus: tofu-forget10
        retain_corpus: tofu-retain90
      calib: *id003
      intervention: *id004
  smoke_args:
    limit: 4
    max_new: 16
  kind_slot: gpu
  est_minutes: 30
  est_vram_gb: 9
  deps:
  - tofu-metrics
- id: tofu-qa-retain
  entry: dsgx.eval.openqa:task
  args:
    items: tofu-retain_perturbed
    model: *id005
    max_new: 64
    methods:
    - *id006
    - *id007
  smoke_args:
    limit: 4
    max_new: 16
  kind_slot: gpu
  est_minutes: 30
  est_vram_gb: 9
  deps:
  - tofu-metrics
- id: paired
  entry: experiments.X1suite.paired:task
  args:
    gate_tag: union-stream
    dsg_tag: dsg-faithful-stream
    x1_exp: PH-union
    gate_label: union
  kind_slot: cpu
  est_minutes: 5
  est_ram_gb: 4
  deps:
  - benign-open
  - leak
  - tofu-qa-forget
  - tofu-qa-retain
  - exp:PH-union
