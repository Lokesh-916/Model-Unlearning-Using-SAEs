# E3 'detect here, erase there' (generated by scripts/make_e3_config.py). DEV split only, never TEST.
# Attribution-patching ranking per Gemma Scope 16k canonical SAE (layers 3-14) + DSG's L3 SAE, then forced-on
# ZERO-ablation (SAE error added back) of the top 10/20/50 causal features, 50 random alive features, DSG's 20
# features, and DSG's -500 clamp forced-on (tau -1). Exploratory; not a claim input (dev only).
exp_id: E3
priority: must
wave: 9
base:
  case: bio
  split: dev
  purpose: explore
  view: raw
  batch_size: 8
  seed: 0
  attack:
    name: none
  datasets:
  - '@forget'
  - '@utility'
  - college_biology
  - high_school_biology
  - anatomy
  - virology
  - medical_genetics
