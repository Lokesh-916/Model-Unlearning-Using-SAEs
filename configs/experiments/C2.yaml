# C2 - streaming and probe gates (MASTER_PLAN 5.3), all calibrated to 5% benign FPR on dev,
# evaluated on test + B1 dilution. Window {8,16,24,32,64}, CUSUM, SAE probe, raw-residual probe.
exp_id: C2
priority: must
wave: 3
base:
  case: bio
  split: test
  purpose: report
  view: both
  batch_size: 1
  datasets: ["@forget", "@dsg4"]
  dataset_label: forget+dsg4
  calib: {fpr: 0.05, n_max: 1000, source: mmlu-dev}
grid:
  attack.pad: [0, 400]
runs:
  - {method: {name: gated, gate: {type: window, w: 8}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: window, w: 16}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: window, w: 24}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: window, w: 32}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: window, w: 64}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: cusum}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: probe_sae, probe_train: mcq-dev}}, attack: {name: dilution}}
  - {method: {name: gated, gate: {type: probe_resid, probe_train: mcq-dev}}, attack: {name: dilution}}
  - {method: {name: dsg-faithful, select: {exp_id: A1-dev, max_utility_drop: 0.01}}, attack: {name: dilution}}
extra:
  - {method: {name: base}, attack: {name: dilution, pad: 0}, batch_size: 16}
jobs: {group_size: 4, est_seconds_per_item: 0.4, est_vram_gb: 9, est_ram_gb: 20, overhead_minutes: 4, deps: ["exp:A1-dev"]}
tasks:
  - {id: attack-success, entry: dsgx.analysis.attack_success:task, kind_slot: cpu, est_minutes: 5, smoke_est_minutes: 1, est_ram_gb: 4, deps: ["exp:C2"]}
smoke:
  base: {limit: 6, datasets: ["@forget", high_school_geography]}
  grid: {attack.pad: [0, 400]}
  runs:
    - {method: {name: gated, gate: {type: window, w: 16}}, attack: {name: dilution}}
    - {method: {name: gated, gate: {type: cusum}}, attack: {name: dilution}}
    - {method: {name: gated, gate: {type: probe_sae, probe_train: mcq-dev, probe_n: 100}}, attack: {name: dilution}}
  extra: [{method: {name: base}, attack: {name: dilution, pad: 0}, batch_size: 6}]
