# D1-local - noised-student distillation (must; 16 GB LoRA fallback, full 2B DEFERRED). Train (task)
# at noise alpha {0.1,0.3,0.5} plus the lora-student-same-ref baseline; eval each baked student
# (no runtime hook) on forget+utility test. A6 relearning of these students runs on A6.
exp_id: D1
priority: must
wave: 5
base:
  case: bio
  split: test
  purpose: report
  view: both
  batch_size: 1
  datasets: ["@forget", "@dsg4"]
  dataset_label: forget+dsg4
  method: {name: base}
runs:
  - {dataset_label: undo-a0.1, model: {weights: ckpt:undo_a0.1}}
  - {dataset_label: undo-a0.3, model: {weights: ckpt:undo_a0.3}}
  - {dataset_label: undo-a0.5, model: {weights: ckpt:undo_a0.5}}
  - {dataset_label: sameref, model: {weights: ckpt:sameref_a0.0}}
extra:
  - {dataset_label: base}
jobs: {group_size: 1, est_seconds_per_item: 0.4, est_vram_gb: 8.5, est_ram_gb: 24, overhead_minutes: 3, deps: ["exp:A1-dev", train-undo-a0.1, train-undo-a0.3, train-undo-a0.5, train-sameref]}
tasks:
  - {id: train-undo-a0.1, entry: experiments.D1.distill:task, args: {noise_alpha: 0.1, steps: 200}, smoke_args: {steps: 4}, kind_slot: gpu, gpu_exclusive: true, est_minutes: 40, smoke_est_minutes: 5, est_vram_gb: 14, est_ram_gb: 30}
  - {id: train-undo-a0.3, entry: experiments.D1.distill:task, args: {noise_alpha: 0.3, steps: 200}, smoke_args: {steps: 4}, kind_slot: gpu, gpu_exclusive: true, est_minutes: 40, smoke_est_minutes: 5, est_vram_gb: 14, est_ram_gb: 30}
  - {id: train-undo-a0.5, entry: experiments.D1.distill:task, args: {noise_alpha: 0.5, steps: 200}, smoke_args: {steps: 4}, kind_slot: gpu, gpu_exclusive: true, est_minutes: 40, smoke_est_minutes: 5, est_vram_gb: 14, est_ram_gb: 30}
  - {id: train-sameref, entry: experiments.D1.distill:task, args: {same_ref: true, noise_alpha: 0.0, steps: 200}, smoke_args: {steps: 4}, kind_slot: gpu, gpu_exclusive: true, est_minutes: 40, smoke_est_minutes: 5, est_vram_gb: 14, est_ram_gb: 30}
smoke:
  base: {limit: 6, datasets: ["@forget", high_school_geography], batch_size: 6}
  runs:
    - {dataset_label: undo-a0.3, model: {weights: ckpt:undo_a0.3}}
  extra:
    - {dataset_label: base}
