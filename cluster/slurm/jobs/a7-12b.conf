# A7-12b: Gemma 3 12B + Gemma Scope 2 12B (layer 24 only). Download first on the lab PC:
#   cluster/fetch_models.sh a7-12b   (~24 GB; gemma-3 needs an accepted licence on the HF account)
STAGE="
$HOME/.cache/huggingface/hub/models--google--gemma-3-12b-it  hf_cache/hub
$HOME/.cache/huggingface/hub/models--google--gemma-scope-2-12b-it  hf_cache/hub
$HOME/projects/mechunlearn-project/dsg_private/translations  private
$HOME/projects/mechunlearn-project/dsg_results/runs/X1-screen/select/COMBINE_SELECTION.json  results
$HOME/projects/mechunlearn-project/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
"
CHAIN="a7-12b.sbatch"
RESULT_PATHS="results/runs/A7-12b results/jobs/a7-12b"
FETCH_EXTRA=""
LARGE_INPUTS="hf_cache/hub/models--google--gemma-3-12b-it hf_cache/hub/models--google--gemma-scope-2-12b-it data/dsg_cache/actcache/gemma-3-12b-it__* private/translations private/corpora/bio-forget-corpus.jsonl"
KEEP="env code base model/SAE/data"
EST_DISK_GB=27; EST_HOURS=4
