# A2-tofu-full: TOFU full fine-tunes + DSG / best gate + TOFU metrics. COMBINE_SELECTION.json (if the X1
# selection exists) picks the best gate's window size.
STAGE="
$HOME/.cache/huggingface/hub/datasets--locuslab--TOFU  hf_cache/hub
$HOME/.cache/huggingface/datasets/locuslab___tofu  hf_cache/datasets
$HOME/projects/mechunlearn-project/dsg_results/runs/X1-screen/select/COMBINE_SELECTION.json  results
"
CHAIN="tofu-full.sbatch"
RESULT_PATHS="results/runs/A2-tofu-full results/jobs/tofu-full"
FETCH_EXTRA=""
LARGE_INPUTS="data/dsg_cache/models/A2-tofu-full/retain"  # A2-tofu-full/full is removed by q2-graphs cleanup (Q2 needs it)
KEEP="env code base model/SAE/data; TOFU data (6 MB)"
EST_DISK_GB=21; EST_HOURS=2.5
