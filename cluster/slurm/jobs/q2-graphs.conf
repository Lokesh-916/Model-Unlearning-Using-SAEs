# Q2 attribution graphs (TOFU mode). Transcoders are streamed by STAGE_SCRIPT (one file at a time; lab PC
# disk floor). Needs the TOFU model data/dsg_cache/models/A2-tofu-full/full from tofu-full: it is removed by
# THIS job's cleanup (tofu-full's cleanup only removes A2-tofu-full/retain), so fetch q2-graphs before cleaning.
# wheels/q2 (29 MB) builds the overlay venv env/q2 (kept: part of env/).
STAGE="
$HOME/projects/mechunlearn-project/wheels/q2  wheels
"
STAGE_SCRIPT="cluster/stage_q2_transcoders.sh"
CHAIN="q2-graphs.sbatch"
RESULT_PATHS="results/runs/Q2-graphs results/jobs/q2-graphs"
FETCH_EXTRA=""
LARGE_INPUTS="hf_cache/hub/models--mwhanna--gemma-scope-transcoders data/dsg_cache/models/A2-tofu-full private/jobs/q2-graphs"
KEEP="env (incl. env/q2) code base model/SAE/data wheels"
# transcoders 7.9 GB + 4 kept graphs (~1 GB) + venv 0.1 GB
EST_DISK_GB=10; EST_HOURS=1.5
