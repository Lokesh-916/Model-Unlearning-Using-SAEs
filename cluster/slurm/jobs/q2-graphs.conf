# Q2 attribution graphs. Download first on the lab PC: cluster/fetch_models.sh q2-graphs (transcoders, ~8 GB).
# wheels/q2 (29 MB) builds the overlay venv env/q2 (kept: it is part of env/).
STAGE="
$HOME/projects/mechunlearn-project/wheels/q2  wheels
$HOME/.cache/huggingface/hub/models--mwhanna--gemma-scope-transcoders  hf_cache/hub
"
CHAIN="q2-graphs.sbatch"
RESULT_PATHS="results/runs/Q2-graphs results/jobs/q2-graphs"
FETCH_EXTRA=""
LARGE_INPUTS="hf_cache/hub/models--mwhanna--gemma-scope-transcoders private/jobs/q2-graphs"
KEEP="env (incl. env/q2) code base model/SAE/data wheels"
EST_DISK_GB=11; EST_HOURS=4
