# X1 TEST replication on gpuws (session 20): the same 33 jobs as the lab X1 TEST wave (combined gate = default gate with
# the CUSUM detector, i.e. its leave-one-out ablation is the default gate; DSG and the default gate as comparators; base;
# 5 seeds; every B attack: dilution, decompose, translate fr/hi/zh, encode, B4 rewrites, B5 suffix) + attack-success,
# run with the pinned exp/X1-combine code (cluster/lab_jobs.py, group x1). A replica: the lab runs keep running and stay
# labpc; these are gpuws (config hardware.label + runs/X1/HARDWARE.json) and are never pooled with them.
P_=$HOME/projects/mechunlearn-project
STAGE="
$P_/dsg_private/translations  private
$P_/dsg_private/B4/rewrites  private/B4
$P_/dsg_private/B5/suffix-200  private/B5
# B1 dilution filler source benign_bio (cais/wmdp-corpora bio-retain-corpus)
$HOME/.cache/huggingface/hub/datasets--cais--wmdp-corpora  hf_cache/hub
$HOME/.cache/huggingface/datasets/cais___wmdp-corpora  hf_cache/datasets
$P_/dsg_cache/leakage  data/dsg_cache
"
STAGE_SCRIPT="cluster/stage_x1.sh"
CHAIN="x1.sbatch x1.sbatch x1.sbatch x1.sbatch"
RESULT_PATHS="results/runs/X1 results/jobs/labjobs-x1"
FETCH_EXTRA=""
LARGE_INPUTS="hf_cache/hub/datasets--cais--wmdp-corpora hf_cache/datasets/cais___wmdp-corpora private/translations private/B4 private/B5 code-X1-*"
KEEP="env code base set; results/runs/A1-dev (select input, 32 run configs, < 1 MB)"
EST_DISK_GB=4; EST_HOURS=6
