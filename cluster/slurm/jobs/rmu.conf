# RMU training (dev grid) + TEST evaluation. Trained best weights are fetched to the lab PC
# (checkpoints/), then deleted here. gemma-2-2b-it, the layer-3 SAE, MMLU/WMDP/wikitext, the bio
# activation cache and the small legacy files are KEPT (every deferred 2B job needs them).
RESULT_PATHS="results/runs/RMU-cluster-train results/runs/RMU-cluster-dev results/runs/RMU-cluster-test results/jobs/rmu"
FETCH_EXTRA="data/dsg_cache/models/RMU-cluster/best"
LARGE_INPUTS="data/dsg_cache/models/RMU-cluster data/dsg_cache/models/RMU-cluster-tmp hf_cache/hub/models--AMindToThink--gemma-2-2b-it_RMU_s200_a300_layer3 private/corpora/bio-forget-corpus.jsonl"
KEEP="env code hf_cache/hub/models--google--gemma-2-2b-it SAE layer_3 datasets data/dsg_cache/actcache data/legacy"
# --- server.sh fields ---
STAGE_SCRIPT="cluster/stage_rmu.sh"
STAGE="
$HOME/.cache/huggingface/hub/models--AMindToThink--gemma-2-2b-it_RMU_s200_a300_layer3  hf_cache/hub
"
CHAIN="rmu_train.sbatch rmu_eval.sbatch"
EST_DISK_GB=37; EST_HOURS=2
