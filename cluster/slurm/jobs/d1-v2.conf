# D1 v2 (session 8): UNDO full-parameter distillation with smaller noise alpha {0.05, 0.1, 0.2} and 4000 steps
# (d1-full: 2000 steps, alpha 0.3/0.5 collapsed MMLU, retain KL still falling at 2000). DEV selection (lowest DEV
# forget accuracy among students whose DEV utility drop vs base <= 0.02), TEST of base / DSG / selected student,
# then full fine-tune relearning (A6-full protocol) on the selected student. cluster/d1_v2.py.
STAGE="
$HOME/projects/mechunlearn-project/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
"
CHAIN="d1-v2-train.sbatch d1-v2-train.sbatch d1-v2-train.sbatch d1-v2-train.sbatch d1-v2-test.sbatch d1-v2-a6.sbatch"
RESULT_PATHS="results/runs/D1-v2 results/runs/A6-full-d1v2 results/jobs/d1-v2 results/jobs/a6-full-d1v2"
FETCH_EXTRA=""
LARGE_INPUTS="data/dsg_cache/models/D1-v2 private/corpora/bio-forget-corpus.jsonl"
KEEP="env code base set"
# 3 students x 5.2 GB + one trainer state (~10 GB) at a time + run dirs
EST_DISK_GB=27; EST_HOURS=10
