# LoRA student and D2 null-space edit (from the lab PC), RMU-cluster best and RMU-v2 best (fetched to the lab PC).
# Targets d1-a0.1 / rmu-v2 added 2026-10-03 (D1-full a0.3/a0.5 collapse utility; RMU v1 under-tuned).
STAGE="
$HOME/projects/mechunlearn-project/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
$HOME/projects/mechunlearn-project/dsg_cache/models/D1/sameref_a0.0  data/dsg_cache/models/D1
$HOME/projects/mechunlearn-project/dsg_cache/models/D2/nullspace  data/dsg_cache/models/D2
$HOME/projects/mechunlearn-project/dsg_results_cluster/checkpoints/RMU-cluster/best  data/dsg_cache/models/RMU-cluster
$HOME/projects/mechunlearn-project/dsg_results_cluster/checkpoints/RMU-v2/best  data/dsg_cache/models/RMU-v2
"
CHAIN="a6-full.sbatch"
RESULT_PATHS="results/runs/A6-full results/jobs/a6-full"
