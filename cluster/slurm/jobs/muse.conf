# A5-muse: MUSE News + Books. Download first on the lab PC: cluster/fetch_models.sh muse (~0.2 GB + metric code).
# Target / retrain models are deleted by the job after each corpus (unless --keep).
STAGE="
$HOME/.cache/huggingface/hub/datasets--muse-bench--MUSE-News  hf_cache/hub
$HOME/.cache/huggingface/hub/datasets--muse-bench--MUSE-Books  hf_cache/hub
$HOME/.cache/huggingface/datasets/muse-bench___muse-news  hf_cache/datasets
$HOME/.cache/huggingface/datasets/muse-bench___muse-books  hf_cache/datasets
"
CHAIN="muse.sbatch"
RESULT_PATHS="results/runs/A5-muse results/jobs/muse"
FETCH_EXTRA=""
LARGE_INPUTS="data/dsg_cache/models/A5-muse hf_cache/hub/datasets--muse-bench--MUSE-News hf_cache/hub/datasets--muse-bench--MUSE-Books hf_cache/datasets/muse-bench___muse-news hf_cache/datasets/muse-bench___muse-books"
KEEP="env code base model/SAE/data"
EST_DISK_GB=22; EST_HOURS=12
