# A5-muse (BM1): MUSE News + Books. Download first on the lab PC: cluster/fetch_models.sh muse (0.16 GB of
# datasets + the official muse_bench tarball). Runs from snapshot code-later4 (stage_code_snapshot.sh later4).
# One model on disk at a time (retrain: train, eval, delete; then target); the job refuses to start a
# fine-tune if free space would drop below 50 GB or ours would reach 100 GB.
STAGE="
$HOME/.cache/huggingface/hub/datasets--muse-bench--MUSE-News  hf_cache/hub
$HOME/.cache/huggingface/hub/datasets--muse-bench--MUSE-Books  hf_cache/hub
$HOME/.cache/huggingface/datasets/muse-bench___muse-news  hf_cache/datasets
$HOME/.cache/huggingface/datasets/muse-bench___muse-books  hf_cache/datasets
$HOME/projects/mechunlearn-project/wheels/muse/muse_bench-main.tar.gz  data/muse
$HOME/projects/mechunlearn-project/wheels/muse/SHA256SUMS  data/muse
"
CHAIN="muse.sbatch muse.sbatch muse.sbatch"
RESULT_PATHS="results/runs/A5-muse results/jobs/muse"
FETCH_EXTRA=""
LARGE_INPUTS="data/dsg_cache/models/A5-muse hf_cache/hub/datasets--muse-bench--MUSE-News hf_cache/hub/datasets--muse-bench--MUSE-Books hf_cache/datasets/muse-bench___muse-news hf_cache/datasets/muse-bench___muse-books data/muse"
KEEP="env code base model/SAE/data"
# one 2B model (5.2 GB) + its trainer state (~10 GB) at a time + datasets 0.2 GB
EST_DISK_GB=16; EST_HOURS=5
