# D1 v3 (PREPARED 2026-10-08, not submitted): UNDO distillation from the WMDP bio forget corpus + WikiText-2 only (no
# benchmark questions), alpha 0.1, 3 seeds, full-MMLU utility (@utility + the 9 hazard-adjacent subjects), open-ended
# leakage / benign evaluation, and full + LoRA relearning of the same controls (dsg-hook, dsg-nohook, rmu-v2) and the
# students on held-out forget passages. cluster/d1_v3.py; README "How to run D1 v3 on gpuws without Claude".
P_=$HOME/projects/mechunlearn-project
STAGE="
$P_/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
$P_/dsg_results_cluster/checkpoints/RMU-v2/best  data/dsg_cache/models/RMU-v2
$HOME/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2  hf_cache/hub
"
# MiniLM grades the open-ended answers; ph-union's cleanup deletes it from gpuws, so it is staged again here.
STAGE_SCRIPT="cluster/stage_code_snapshot.sh d1v3"
CHAIN="d1-v3-train.sbatch d1-v3-train.sbatch d1-v3-train.sbatch d1-v3-train.sbatch d1-v3-test.sbatch d1-v3-test.sbatch d1-v3-open.sbatch d1-v3-open.sbatch d1-v3-relearn.sbatch d1-v3-relearn.sbatch d1-v3-relearn.sbatch d1-v3-relearn.sbatch"
RESULT_PATHS="results/runs/D1-v3 results/runs/D1-v3-relearn-full results/runs/D1-v3-relearn-lora results/jobs/d1-v3"
FETCH_EXTRA=""
FETCH_EXCLUDE="last/trainer.pt"
LARGE_INPUTS="data/dsg_cache/models/D1-v3 data/dsg_cache/models/RMU-v2 private/corpora/bio-forget-corpus.jsonl private/D1-v3 hf_cache/hub/models--sentence-transformers--all-MiniLM-L6-v2 code-d1v3"
KEEP="env code base set (gemma-2-2b-it, Gemma Scope L3, wmdp, mmlu, wikitext, MiniLM)"
# students 3 x 5.2 + one trainer state ~10 (deleted after each seed) + RMU-v2 4.9 + corpus 0.7 + run dirs ~0.5
EST_DISK_GB=32; EST_HOURS=21
# Needs >= 82 GB free on gpuws / before staging (50 GB floor + 32 GB peak): `cluster/server.sh plan d1-v3` shows it and
# `stage` refuses otherwise. 2026-10-08: 63 GB free (other users) -> not stageable that day; never lower the limits.
