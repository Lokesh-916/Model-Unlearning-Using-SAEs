# RMU v2: wider DEV grid (16 configs, probed batch size) + TEST eval with all comparators on gpuws.
# Reuses the kept base set (gemma-2-2b-it, L3 SAE, WMDP/MMLU/wikitext, legacy ids). Runs from a code snapshot
# (code-rmu-v2/) so it can be queued behind a running chain without touching code/.
# Submit behind another chain: cluster/server.sh submit rmu-v2 --after-any <last job id>.
STAGE="
$HOME/.cache/huggingface/hub/models--AMindToThink--gemma-2-2b-it_RMU_s200_a300_layer3  hf_cache/hub
$HOME/projects/mechunlearn-project/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
"
STAGE_SCRIPT="cluster/stage_code_snapshot.sh rmu-v2"
CHAIN="rmu-v2-train.sbatch rmu-v2-eval.sbatch"
RESULT_PATHS="results/runs/RMU-v2-train results/runs/RMU-v2-dev results/runs/RMU-v2-test results/jobs/rmu-v2"
FETCH_EXTRA="data/dsg_cache/models/RMU-v2/best"
LARGE_INPUTS="data/dsg_cache/models/RMU-v2 data/dsg_cache/models/RMU-v2-tmp hf_cache/hub/models--AMindToThink--gemma-2-2b-it_RMU_s200_a300_layer3 private/corpora/bio-forget-corpus.jsonl code-rmu-v2"
KEEP="env code base model/SAE/data"
# third-party RMU 9.8 + best 5.2 + one tmp model 5.2 + trainer state/run dirs ~1
EST_DISK_GB=21; EST_HOURS=5
