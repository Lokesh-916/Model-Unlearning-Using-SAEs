# A6 LoRA tampering grid on LAB-MADE weights (MOVED-TO-SERVER, 33 lab jobs): legacy student (exp/D1 sameref_a0.0),
# D1-local (exp/D1 undo_a0.3) and D2 null-space (exp/D2). Stage ONLY after the lab jobs D1-train-sameref,
# D1-train-undo-a0.3 (Wave 5) and D2-edit-nullspace (Wave 3) are DONE; missing weights are skipped at staging.
# Run 'cleanup a6-lora --yes' first (both groups write runs/A6).
STAGE="
# A6-benign fine-tunes on alpaca (job 108/109 failed offline without it)
$HOME/.cache/huggingface/hub/datasets--tatsu-lab--alpaca  hf_cache/hub
$HOME/.cache/huggingface/datasets/tatsu-lab___alpaca  hf_cache/datasets
$HOME/projects/mechunlearn-project/baselines_DSG/dynamic_sae_guardrails/evals/unlearning/data/bio-forget-corpus.jsonl  private/corpora
$HOME/projects/mechunlearn-project/dsg_cache/models/D1/sameref_a0.0  data/dsg_cache/models/D1
$HOME/projects/mechunlearn-project/dsg_cache/models/D1/undo_a0.3  data/dsg_cache/models/D1
$HOME/projects/mechunlearn-project/dsg_cache/models/D2/nullspace  data/dsg_cache/models/D2
"
# A6_BAKED_GLOBS narrows the staged jobs to the weights that exist, e.g. A6_BAKED_GLOBS='A6-*-d2 A6-*-d2-*' (D2 only,
# 2026-10-05); restage later with the default (all three) and DONE jobs are skipped.
STAGE_SCRIPT="cluster/stage_lab_jobs.sh a6-baked ${A6_BAKED_GLOBS:-A6-*-student* A6-*-d1 A6-*-d1-* A6-*-d2 A6-*-d2-*}"
CHAIN="a6-baked.sbatch a6-baked.sbatch a6-baked.sbatch a6-baked.sbatch"
RESULT_PATHS="results/runs/A6 results/jobs/labjobs-a6-baked"
FETCH_EXTRA=""
LARGE_INPUTS="data/dsg_cache/models/D1 data/dsg_cache/models/D2 code-A6-*"
KEEP="env code base set"
EST_DISK_GB=18; EST_HOURS=8
