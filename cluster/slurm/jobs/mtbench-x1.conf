# MT-Bench for the final method (session 22, PREPARED, NOT SUBMITTED): mode cusum (X1 combined gate) next to the existing
# gpuws base / dsg / window-w16 answers and judgments, same fixed judge google/gemma-2-9b-it (same family: labelled),
# same machine. Resumable: only cusum answers (160) and their judgments are new (~2 x 3 h). Stage only after MUSE-v2
# (178-180) has left the queue: the judge (18 GB) staged earlier makes MUSE's in-job disk guard refuse (session 16).
P_=$HOME/projects/mechunlearn-project
STAGE="
$HOME/.cache/huggingface/hub/models--google--gemma-2-9b-it  hf_cache/hub
$P_/dsg_results_cluster/jobs/mtbench  results/jobs
"
CHAIN="mtbench-x1.sbatch mtbench-x1.sbatch"
RESULT_PATHS="results/jobs/mtbench"
FETCH_EXTRA=""
LARGE_INPUTS="hf_cache/hub/models--google--gemma-2-9b-it"
KEEP="env code base model/SAE/data"
EST_DISK_GB=19; EST_HOURS=6
